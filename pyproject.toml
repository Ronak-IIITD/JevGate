[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-gate"
version = "0.2.0"
description = "An MCP and API security gateway for AI agent inputs and proposed tool calls, powered by Jev."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
license = "MIT"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "mcp>=1.28.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/Ronak-IIITD/JevGate"
Repository = "https://github.com/Ronak-IIITD/JevGate"
Issues = "https://github.com/Ronak-IIITD/JevGate/issues"
Changelog = "https://github.com/Ronak-IIITD/JevGate/blob/main/CHANGELOG.md"

[project.scripts]
jev-gate-mcp = "jev_gate.mcp_server:main"

[project.optional-dependencies]
direct-typesafe = ["typesafe-sdk>=0.7.5,<0.8.0"]
dev = ["pytest>=8.3.0", "httpx>=0.27.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_gate = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
